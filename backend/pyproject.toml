[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "citycode-backend"
version = "0.1.0"
description = "Hackathon backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.29.0",
    "pydantic-settings>=2.1.0",
    "alembic>=1.13.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]
